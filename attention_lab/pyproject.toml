[project]
name = "eaas-attention-lab"
version = "0.1.0"
description = "Course examples: the real weights, embeddings and attention matrices of GPT-2 small, computed on a laptop CPU"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=1.0,<3",
    "matplotlib>=3.10,<4",
    "numpy>=2.4,<3",
    "safetensors>=0.6,<1",
    "tokenizers>=0.22.2,<0.24",
]

[project.scripts]
model-weights = "eaas_attention_lab.commands.model_weights:main"
one-head = "eaas_attention_lab.commands.one_head:main"
attention-sink = "eaas_attention_lab.commands.attention_sink:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "pytest>=8.4,<10",
    "ruff>=0.17.0,<0.18",
]
# Optional, for one check only: the reference implementation of GPT-2, to
# compare gpt2.py with (tests/test_reference.py). No script needs it, and it
# adds 400 to 850 MB, depending on the system. Run the check with:
# uv run --group reference pytest
reference = [
    "torch>=2.6,<3",
    "transformers>=5,<6",
]

# PyTorch for the CPU only, from PyTorch's own package index, as uv's PyTorch
# guide describes (https://docs.astral.sh/uv/guides/integration/pytorch/).
# "explicit" means that only torch is looked up there; all other packages
# come from PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 88
# Code blocks in the Markdown guides are excerpts. Check only Python files.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: PEP 8 layout
    "F",       # Pyflakes: unused imports, undefined names
    "I",       # isort: import order
    "N",       # pep8-naming
    "D",       # pydocstyle: docstrings
    "UP",      # pyupgrade: modern syntax for the supported Python versions
    "ANN",     # flake8-annotations: type hints on every function
    "B",       # flake8-bugbear: likely bugs
    "S",       # flake8-bandit: security, e.g. HTTP requests without a timeout
    "SIM",     # flake8-simplify
    "PTH",     # prefer pathlib over os.path
    "RUF",     # Ruff's own checks
]

[tool.ruff.lint.per-file-ignores]
# Tests use plain assert statements and need no docstrings for each test.
"tests/*" = ["S101", "D103"]
# PyTorch and Transformers are optional and arrive untyped, through
# pytest.importorskip.
"tests/test_reference.py" = ["S101", "D103", "ANN401"]

[tool.ruff.lint.pydocstyle]
convention = "google"
